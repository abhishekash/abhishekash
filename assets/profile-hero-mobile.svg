<svg xmlns="http://www.w3.org/2000/svg" width="700" height="524" viewBox="0 0 700 524" role="img" aria-labelledby="title desc">
<title id="title">Abhishek Ash — making agents easier to understand</title>
<desc id="desc">Senior Staff Engineer in Berlin. Agenturm for agent monitoring, SpanHound for trace inspection, and agent-evals for regression checks. A geometric amber tower represents a clear view of agent activity.</desc>
<defs><linearGradient id="sky" x2="1" y2="1"><stop stop-color="#30223d"/><stop offset="1" stop-color="#121018"/></linearGradient></defs>
<rect x=".5" y=".5" width="699" height="523" rx="24" fill="url(#sky)" stroke="#51475f"/>

<g font-family="DejaVu Sans Mono,monospace">
  <path d="M32 35h28" stroke="#ffbd69" stroke-width="3"/>
  <text x="74" y="41" fill="#b9afc5" font-size="15" letter-spacing="1">OPEN SOURCE / AGENT TOOLS</text>
  <text x="32" y="98" fill="#f6f0e8" font-size="29" font-weight="bold">ABHISHEK ASH</text>
  <text x="32" y="133" fill="#b9afc5" font-size="17">SENIOR STAFF ENGINEER · BERLIN</text>
</g>
<g transform="translate(518 59) scale(.28)"><path xmlns="http://www.w3.org/2000/svg" d="M144 112h48v48h40v-48h48v48h40v-48h48v112h-40l16 144h24v40H144v-40h24l16-144h-40Z          M240 264v56h32v-56a16 16 0 0 0-32 0Z" fill="#ffbd69" fill-rule="evenodd" />
</g>
<g font-family="DejaVu Sans,Arial,sans-serif" font-size="56" font-weight="bold" letter-spacing="-1.5">
  <text x="30" y="224" fill="#f6f0e8">Making agents</text>
  <text x="30" y="292" fill="#ffbd69">easier to understand.</text>
</g>
<text x="32" y="343" fill="#b9afc5" font-family="DejaVu Sans,Arial,sans-serif" font-size="20">See the work. Follow the evidence. Check the behavior.</text>
<path d="M32 381h636" stroke="#51475f"/>
