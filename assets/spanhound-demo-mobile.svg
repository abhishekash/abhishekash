<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480" role="img" aria-labelledby="title desc">
<title id="title">SpanHound demo output excerpt</title><desc id="desc">A scripted regression: run_shell failed because ../outside.txt escaped the workspace. The trace has six spans and an automatic approval.</desc>
<rect width="700" height="480" rx="16" fill="#191621"/>
<path d="M0 64h700" stroke="#51475f"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="28" y="40" fill="#f6f0e8" font-size="25" font-weight="600">SpanHound</text><text x="672" y="40" text-anchor="end" fill="#b9afc5" font-size="18">SCRIPTED REGRESSION</text></g>
<g font-family="DejaVu Sans Mono,Consolas,monospace" font-size="26">
<text x="28" y="119" fill="#c5adff">$ <tspan fill="#f6f0e8">uvx spanhound demo</tspan></text>
<text x="28" y="181" fill="#b9afc5">Tool: <tspan fill="#f6f0e8">run_shell</tspan></text>
<rect x="16" y="204" width="668" height="142" rx="8" fill="#422330"/>
<g fill="#ff8799"><text x="28" y="241">Failure: error:</text><text x="28" y="282">shell path escapes workspace root:</text><text x="28" y="323">'../outside.txt'</text></g>
<text x="28" y="390" fill="#b9afc5">Approval: <tspan fill="#f6f0e8">approve (auto)</tspan></text>
<text x="28" y="438" fill="#b9afc5" font-size="20">Trace: 563e779ee8fa2d7069fc63ed2cf9c8ec (6 spans)</text>
</g></svg>
