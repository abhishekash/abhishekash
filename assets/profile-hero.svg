<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
<title id="title">Abhishek Ash — making agents easier to understand</title>
<desc id="desc">Senior Staff Engineer in Berlin. Agenturm for agent monitoring, SpanHound for trace inspection, and agent-evals for regression checks. A geometric amber tower represents a clear view of agent activity.</desc>
<defs><linearGradient id="sky" x2="1" y2="1"><stop stop-color="#30223d"/><stop offset="1" stop-color="#121018"/></linearGradient></defs>
<rect x=".5" y=".5" width="1279" height="469" rx="24" fill="url(#sky)" stroke="#51475f"/>

<g font-family="DejaVu Sans Mono,monospace">
  <path d="M48 47h32" stroke="#ffbd69" stroke-width="3"/>
  <text x="94" y="53" fill="#b9afc5" font-size="14" letter-spacing="2">OPEN SOURCE / AGENT TOOLS</text>
  <text x="48" y="107" fill="#f6f0e8" font-size="22" font-weight="bold" letter-spacing="2">ABHISHEK ASH</text>
  <text x="48" y="138" fill="#b9afc5" font-size="15">SENIOR STAFF ENGINEER · BERLIN</text>
</g>
<g font-family="DejaVu Sans,Arial,sans-serif" font-size="66" font-weight="bold" letter-spacing="-1.5">
  <text x="44" y="227" fill="#f6f0e8">Making agents</text>
  <text x="44" y="307" fill="#ffbd69">easier to understand.</text>
</g>
<text x="48" y="353" fill="#b9afc5" font-family="DejaVu Sans,Arial,sans-serif" font-size="21">See the work. Follow the evidence. Check the behavior.</text>
<g transform="translate(948 52) scale(.5)"><path xmlns="http://www.w3.org/2000/svg" d="M144 112h48v48h40v-48h48v48h40v-48h48v112h-40l16 144h24v40H144v-40h24l16-144h-40Z          M240 264v56h32v-56a16 16 0 0 0-32 0Z" fill="#ffbd69" fill-rule="evenodd" />
</g>
<path d="M48 390h1184" stroke="#51475f"/>
<g font-family="DejaVu Sans Mono,monospace" font-size="16">
  <text x="48" y="434" fill="#ffbd69">01 / AGENTURM</text>
  <text x="475" y="434" fill="#c5adff">02 / SPANHOUND</text>
