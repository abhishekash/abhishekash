  <linearGradient id="cool-ridge" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#eee4ff"/><stop offset=".5" stop-color="#c5adff"/><stop offset="1" stop-color="#8262bc"/></linearGradient>
</defs>
